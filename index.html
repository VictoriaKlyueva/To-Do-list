<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1 class="header">Задорный To-Do List</h1>
    </header>

  <main class="main-content">
    <div class="task-form">
      <div class="form-group">
        <input type="text" class="task-form__input" id="task-title" placeholder="Название задачи*" minlength="4" required>
      </div>
      <div class="form-group">
        <textarea class="task-form__textarea" id="task-description" placeholder="Описание"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <input type="datetime-local" class="task-form__date" id="task-deadline">
        </div>
        <div class="form-group">
          <select class="task-form__select" id="task-priority">
            <option value="">Не выбрано</option>
            <option value="Medium">Средний приоритет</option>
            <option value="Low">Низкий приоритет</option>
            <option value="High">Высокий приоритет</option>
            <option value="Critical">Критический приоритет</option>
          </select>
        </div>
      </div>
      <button id="add" class="task-form__button">Добавить задачу</button>
    </div>
    
    <div class="tasks-section">
      <h2 class="tasks-section__title">Список задач</h2>

      <div class="tasks-controls">
        <div class="filter-control">
          <label for="status-filter">Фильтр по статусу:</label>
          <select id="status-filter" class="form-select">
            <option value="">Все</option>
            <option value="Active">Активные</option>
            <option value="Completed">Выполненные</option>
            <option value="Overdue">Просроченные</option>
            <option value="Late">Завершённые с опозданием</option>
          </select>
        </div>
        
        <div class="sort-control">
          <label for="sort-by">Сортировать по:</label>
          <select id="sort-by" class="form-select">
            <option value="deadline">Дедлайну</option>
            <option value="priority">Приоритету</option>
            <option value="title">Названию</option>
            <option value="createdDate">Дате создания</option>
          </select>
          
          <label class="sort-direction">
            <input type="checkbox" id="sort-descending">
            <span>По убыванию</span>
          </label>
        </div>
      </div>

      <div class="tasks-list" id="tasks-container"></div>
    </div>
  </main>
</div>

  <!-- Модальное окно редактирования -->
  <div class="modal" id="edit-modal">
    <div class="modal__content">
      <span class="modal__close">&times;</span>
      <h3 class="modal__title">Редактировать задачу</h3>
      <form class="edit-form">
        <div class="form-group">
          <label class="form-label">Название:</label>
          <input type="text" id="edit-title" class="form-input" minlength="4" required>
        </div>
        <div class="form-group">
          <label class="form-label">Описание:</label>
          <textarea id="edit-description" class="form-textarea"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Дедлайн:</label>
          <input type="datetime-local" id="edit-deadline" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Приоритет:</label>
          <select id="edit-priority" class="form-select">
            <option value="Low">Низкий</option>
            <option value="Medium">Средний</option>
            <option value="High">Высокий</option>
            <option value="Critical">Критический</option>
          </select>
        </div>
        <button type="button" id="save-changes" class="form-button">Сохранить</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
