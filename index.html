<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrapper site-header__wrapper">
      <h1 class="main-label">To-Do List</h1>
    </div>
  </header>
  
  <main>
    <div class="new-task-field">
      <input type="text" name="taskInput" placeholder="Название задачи" minlength="4" required>
      <button id="add" class="add-btn">Добавить</button>
    </div>
    
    <div class="tasks-container">
      <h2 class="tasks-title">Список задач</h2>
      <div class="tasks-divs"></div>
    </div>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
