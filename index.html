<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1 class="header__title">To-Do List</h1>
    </header>
    
    <main class="main-content">
      <div class="task-form">
        <input type="text" class="task-form__input" placeholder="Название задачи" minlength="4" required>
        <button id="add" class="task-form__button">Добавить</button>
      </div>
      
      <div class="tasks-section">
        <h2 class="tasks-section__title">Список задач</h2>
        <div class="tasks-list" id="tasks-container"></div>
      </div>
    </main>
  </div>

  <!-- Модальное окно редактирования -->
  <div class="modal" id="edit-modal">
    <div class="modal__content">
      <span class="modal__close">&times;</span>
      <h3 class="modal__title">Редактировать задачу</h3>
      <form class="edit-form">
        <div class="form-group">
          <label class="form-label">Название:</label>
          <input type="text" id="edit-title" class="form-input" minlength="4" required>
        </div>
        <div class="form-group">
          <label class="form-label">Описание:</label>
          <textarea id="edit-description" class="form-textarea"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Дедлайн:</label>
          <input type="datetime-local" id="edit-deadline" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Приоритет:</label>
          <select id="edit-priority" class="form-select">
            <option value="Low">Низкий</option>
            <option value="Medium">Средний</option>
            <option value="High">Высокий</option>
            <option value="Critical">Критический</option>
          </select>
        </div>
        <button type="button" id="save-changes" class="form-button">Сохранить</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
